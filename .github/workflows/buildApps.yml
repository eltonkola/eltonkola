name: Build All Binaries

on:
  workflow_dispatch:

jobs:
  prepare-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v1

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Run lints
        run: |
          cd EltonKola_Web
          ./gradlew shared:lint

  build-android:
    runs-on: ubuntu-latest
    needs: [prepare-project]
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v1

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Build APK
        run: |
          cd EltonKola_Web
          ./gradlew androidApp:assembleRelease

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: EltonKola_Web/androidApp/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app.apk
          path: ${{steps.sign_app.outputs.signedReleaseFile}}

      #- name: Upload to slack step
      #  uses: MeilCli/slack-upload-file@v3
      #  with:
      #    slack_token: ${{ secrets.SLACK_TOKEN }}
      #    channel_id: 'C01PMHNE40Z'
      #    file_path: ${{steps.sign_app.outputs.signedReleaseFile}}
      #    file_name: 'eltonKola.apk'
      #    file_type: 'apk'
      #    initial_comment: 'post by slack-upload-file'

  build-linux:
    runs-on: ubuntu-latest
    needs: [prepare-project]
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v1

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Build Deb
        run: |
          cd EltonKola_Web
          ./gradlew desktopApp:packageDeb

      - name: Upload DEB
        uses: actions/upload-artifact@v3
        with:
          name: app.deb
          path: EltonKola_Web/desktopApp/build/compose/binaries/main/deb/eltonkola_1.0.0-1_amd64.deb # Ensure this filename is correct

  build-web:
    runs-on: ubuntu-latest
    needs: [prepare-project]
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v1

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Build Web App (WasmJs)
        run: |
          cd EltonKola_Web
          ./gradlew :composeApp:wasmJsBrowserDistribution
          echo "Zipping web distribution..."
          ls -R composeApp/build/dist/wasmJs/productionExecutable/
          zip -jr ../../web_dist.zip composeApp/build/dist/wasmJs/productionExecutable/
          # The zip will be created at EltonKola_Web/web_dist.zip relative to repo root, or just web_dist.zip if CWD is EltonKola_Web
          # For clarity, let's ensure it's at the root of the workspace for upload
          mv ../../web_dist.zip ${{ github.workspace }}/web.zip

      - name: Upload Web Files
        uses: actions/upload-artifact@v3
        with:
          name: web.zip # This is the artifact name, the file itself is web.zip at the root
          path: ${{ github.workspace }}/web.zip

  build-windows:
    runs-on: windows-latest
    needs: [prepare-project]
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v1

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Build Msi
        run: |
          cd EltonKola_Web
          ./gradlew desktopApp:packageMsi

      - name: Upload Msi
        uses: actions/upload-artifact@v3
        with:
          name: app.msi
          path: EltonKola_Web\desktopApp\build\compose\binaries\main\msi\EltonKola-1.0.0.msi # Ensure this filename is correct

  build-macos:
    runs-on: macos-latest
    needs: [prepare-project]
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v1

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Build Dmg
        run: |
          cd EltonKola_Web
          ./gradlew desktopApp:packageDmg

      - name: Upload Dmg
        uses: actions/upload-artifact@v3
        with:
          name: app.dmg
          path: EltonKola_Web/desktopApp/build/compose/binaries/main/dmg/EltonKola-1.0.0.dmg # Ensure this filename is correct

  build-ios:
    runs-on: macos-latest
    needs: [prepare-project]
    steps:
      - name: check Xcode version
        run: /usr/bin/xcodebuild -version

      - name: Checkout
        uses: actions/checkout@v3

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v1

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Install the Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Build project (shared framework)
        run: |
          cd EltonKola_Web
          ./gradlew shared:iosArm64Binaries

      - name: build archive
        run: |
          cd EltonKola_Web/iosApp
          pod install --repo-update # Added --repo-update for safety
          xcodebuild -scheme "iosApp" \
          -archivePath $RUNNER_TEMP/eltonkola.xcarchive \
          -sdk iphoneos \
          -configuration Release \ # Changed to Release, Debug is unusual for final IPA
          -destination generic/platform=iOS \
          clean archive

      - name: export ipa
        env:
          EXPORT_OPTIONS_PLIST: ${{ secrets.EXPORT_OPTIONS_PLIST }}
        run: |
          # cd EltonKola_Web/iosApp # Already in this directory from previous step if not using separate shells
          EXPORT_OPTS_PATH=$RUNNER_TEMP/ExportOptions.plist
          echo -n "$EXPORT_OPTIONS_PLIST" | base64 --decode -o $EXPORT_OPTS_PATH
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/eltonkola.xcarchive -exportOptionsPlist $EXPORT_OPTS_PATH -exportPath $RUNNER_TEMP/build

      - name: Upload application (IPA)
        uses: actions/upload-artifact@v3
        with:
          name: app.ipa
          path: ${{ runner.temp }}/build/iosApp.ipa
          retention-days: 3

  update-website:
    runs-on: ubuntu-latest
    needs: [build-web, build-android, build-linux, build-windows, build-macos] # , build-ios (uncomment if iOS is consistently built)
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v3
        # No need for Validate Gradle Wrapper here if not building

      - name: Prepare public directory structure
        run: |
          rm -rf public # Clear old public directory
          mkdir -p public/downloads # Create public and downloads subfolder

      - name: Download Web Artifact
        uses: actions/download-artifact@v3
        with:
          name: web.zip
          path: public/downloads # Downloads web.zip into public/downloads/

      - name: Download APK Artifact
        uses: actions/download-artifact@v3
        with:
          name: app.apk
          path: public/downloads # Downloads app.apk into public/downloads/

      - name: Download DEB Artifact
        uses: actions/download-artifact@v3
        with:
          name: app.deb
          path: public/downloads

      - name: Download MSI Artifact
        uses: actions/download-artifact@v3
        with:
          name: app.msi
          path: public/downloads

      - name: Download DMG Artifact
        uses: actions/download-artifact@v3
        with:
          name: app.dmg
          path: public/downloads
      
      # - name: Download IPA Artifact # Uncomment if iOS build is active
      #   uses: actions/download-artifact@v3
      #   with:
      #     name: app.ipa
      #     path: public/downloads

      - name: Extract web content and organize files
        run: |
          echo "Contents of public/downloads before unzip:"
          ls -R public/downloads
          unzip -o public/downloads/web.zip -d public/ # Extracts content of web.zip to public/
          echo "Contents of public/ after unzip:"
          ls -R public/
          # The web.zip itself remains in public/downloads/ which is intended

      - name: Create Pull Request for Website Update
        uses: peter-evans/create-pull-request@v6 # Updated to v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # More explicit, though often inferred
          commit-message: 'update website content and binaries'
          branch: website_update
          delete-branch: true
          title: '[publish] Update website and app binaries'
          assignees: ${{ github.actor }}
          base: main # Or your default branch
          body: |
            Update website content and application binaries.
            - Deployed new web build to `public/`
            - Copied all built binaries to `public/downloads/`
          labels: |
            deployment
            automated-pr
          # Ensures only changes in 'public' directory are committed.
          # If other files are modified by the workflow and should not be part of this PR,
          # you might need to be more specific with git add commands before this step,
          # or use path filters if the action supports it.
          # This action generally commits all uncommitted changes.

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-android, build-macos, build-windows, build-web, build-linux] # , build-ios (uncomment if iOS is consistently built)
    steps:
      - name: Download all artifacts for release
        uses: actions/download-artifact@v3
        with:
          path: downloads/ # This will create subdirectories for each artifact, e.g., downloads/app.apk/app.apk

      - name: List downloaded files for verification
        run: |
          ls -R downloads/
          # Move files to a flat structure if download-artifact created subdirs
          # This is necessary because download-artifact@v3 (without a name) downloads each artifact into its own subdirectory.
          mkdir -p release_assets
          cp downloads/app.apk/app.apk release_assets/app.apk
          cp downloads/app.deb/app.deb release_assets/app.deb
          cp downloads/app.msi/app.msi release_assets/app.msi
          cp downloads/app.dmg/app.dmg release_assets/app.dmg
          cp downloads/web.zip/web.zip release_assets/web.zip
          # if [ -f downloads/app.ipa/app.ipa ]; then cp downloads/app.ipa/app.ipa release_assets/app.ipa; fi # Uncomment for iOS
          echo "Contents of release_assets:"
          ls release_assets/

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.${{ github.run_number }} # Example: v1.0.1, v1.0.2 etc.
          release_name: Release v1.0.${{ github.run_number }}
          draft: false
          prerelease: false

      - name: Upload Release APK
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: release_assets/app.apk
          asset_name: ek-${{ github.run_number }}.apk
          asset_content_type: application/vnd.android.package-archive

      - name: Upload Release Deb
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: release_assets/app.deb
          asset_name: ek-${{ github.run_number }}-amd64.deb
          asset_content_type: application/vnd.debian.binary-package

      - name: Upload Release Msi
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: release_assets/app.msi
          asset_name: ek-${{ github.run_number }}.msi
          asset_content_type: application/x-msi

      - name: Upload Release Dmg
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: release_assets/app.dmg
          asset_name: ek-${{ github.run_number }}.dmg
          asset_content_type: application/x-apple-diskimage

      - name: Upload Release Web (Zip)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: release_assets/web.zip
          asset_name: web-dist-${{ github.run_number }}.zip
          asset_content_type: application/zip

      # - name: Upload Release IPA # Uncomment for iOS
      #   uses: actions/upload-release-asset@v1
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   with:
      #     upload_url: ${{ steps.create_release.outputs.upload_url }}
      #     asset_path: release_assets/app.ipa
      #     asset_name: ek-${{ github.run_number }}.ipa
      #     asset_content_type: application/octet-stream

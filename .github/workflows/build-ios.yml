name: Build iOS

on:
  workflow_call:
  workflow_dispatch:

env:
  # === PROJECT SPECIFIC - ADJUST THESE ===
  # If your KMP project is in a subfolder like 'EltonKola_Web', uncomment and set this:
  PROJECT_SUBFOLDER: EltonKola_Web # EXAMPLE: Set if your project is in a subfolder
  KMP_MODULE_NAME: composeApp # Or 'shared', or whatever your KMP shared module is named
  IOS_APP_FOLDER: iosApp # Name of the folder containing the Xcode project (usually iosApp)
  IOS_SCHEME: iosApp # Your Xcode scheme name
  # === END PROJECT SPECIFIC ===

  KEYCHAIN_NAME: build.keychain
  # KEYCHAIN_PASSWORD will come from secrets

jobs:
  build-ipa:
    runs-on: macos-14
    

    steps:
    
    - name: Discover and Select Xcode
      run: |
        echo "--- Available Applications (looking for Xcode) ---"
        ls /Applications/

        echo "--- Detailed Xcode Versions Found ---"
        for XCODE_APP_PATH in /Applications/Xcode*.app; do
          if [ -d "$XCODE_APP_PATH" ]; then
            echo "Found: $XCODE_APP_PATH"
            $XCODE_APP_PATH/Contents/Developer/usr/bin/xcodebuild -version
          fi
        done
        echo "----------------------------------------"

        # --- YOU NEED TO DECIDE THE DESIRED_XCODE_PATH BASED ON THE OUTPUT ABOVE ---
        # --- AND THE XCODE VERSION YOU USED TO SAVE YOUR PROJECT LOCALLY ---
        # Example: If the output shows /Applications/Xcode_16.0.app and you need Xcode 16:
        # DESIRED_XCODE_PATH="/Applications/Xcode_16.0.app"
        # Example: If the output shows /Applications/Xcode_15.3.app (but remember 15.4 is already failing you)
        
        DESIRED_XCODE_PATH="" # Initialize

        # --- START OF AUTO-SELECTION LOGIC (Attempt to find the newest available) ---
        # This is a simple attempt. Manually setting DESIRED_XCODE_PATH above is more reliable if you know what you need.
        LATEST_FOUND_XCODE=""
        if [ -d "/Applications/Xcode_16.0.app" ]; then # Prioritize Xcode 16 if available
            LATEST_FOUND_XCODE="/Applications/Xcode_16.0.app"
        elif [ -d "/Applications/Xcode_15.4.app" ]; then # Then 15.4 (which is current default and failing)
            LATEST_FOUND_XCODE="/Applications/Xcode_15.4.app" # Unlikely to fix, but for completeness
        elif [ -d "/Applications/Xcode_15.3.app" ]; then # Then 15.3
            LATEST_FOUND_XCODE="/Applications/Xcode_15.3.app" # Unlikely to fix
        # Add more versions here if needed, from newest to oldest
        fi
        
        # If you manually set DESIRED_XCODE_PATH, it will override the auto-selection
        if [ -z "$DESIRED_XCODE_PATH" ] && [ -n "$LATEST_FOUND_XCODE" ]; then
            echo "Auto-selecting: $LATEST_FOUND_XCODE (based on availability)"
            DESIRED_XCODE_PATH="$LATEST_FOUND_XCODE"
        elif [ -z "$DESIRED_XCODE_PATH" ]; then
            echo "No specific newer Xcode path found or manually set. Will use system default."
            # No need to run xcode-select if we're sticking with default
            exit 0 # Exit this step successfully, let the next step show default version
        fi
        # --- END OF AUTO-SELECTION LOGIC ---

        if [ -n "$DESIRED_XCODE_PATH" ] && [ -d "$DESIRED_XCODE_PATH" ]; then
          CURRENT_XCODE_DEFAULT_PATH=$(xcode-select -p)
          if [ "$CURRENT_XCODE_DEFAULT_PATH" != "$DESIRED_XCODE_PATH/Contents/Developer" ]; then
            echo "Current Xcode default is: $CURRENT_XCODE_DEFAULT_PATH"
            echo "Switching to Xcode: $DESIRED_XCODE_PATH"
            sudo xcode-select -s "$DESIRED_XCODE_PATH/Contents/Developer"
          else
            echo "Desired Xcode ($DESIRED_XCODE_PATH) is already the default. No change needed."
          fi
        else
          echo "WARNING: DESIRED_XCODE_PATH ('$DESIRED_XCODE_PATH') not found or not a directory. Using system default."
        fi
      
    - name: Check Xcode version (after select)
      run: xcodebuild -version
    
    
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Define Project Paths
      id: paths
      run: |
        if [ -n "${{ env.PROJECT_SUBFOLDER }}" ]; then
          echo "ROOT_DIR=${{ env.PROJECT_SUBFOLDER }}" >> $GITHUB_OUTPUT
          echo "IOS_DIR=${{ env.PROJECT_SUBFOLDER }}/${{ env.IOS_APP_FOLDER }}" >> $GITHUB_OUTPUT
          echo "GRADLE_KMP_MODULE_PATH=:${{ env.KMP_MODULE_NAME }}" >> $GITHUB_OUTPUT
        else
          echo "ROOT_DIR=." >> $GITHUB_OUTPUT
          echo "IOS_DIR=${{ env.IOS_APP_FOLDER }}" >> $GITHUB_OUTPUT
          echo "GRADLE_KMP_MODULE_PATH=:${{ env.KMP_MODULE_NAME }}" >> $GITHUB_OUTPUT
        fi
        echo "Resolved ROOT_DIR: $(if [ -n "${{ env.PROJECT_SUBFOLDER }}" ]; then echo "${{ env.PROJECT_SUBFOLDER }}"; else echo "."; fi)"
        echo "Resolved IOS_DIR: $(if [ -n "${{ env.PROJECT_SUBFOLDER }}" ]; then echo "${{ env.PROJECT_SUBFOLDER }}/${{ env.IOS_APP_FOLDER }}"; else echo "${{ env.IOS_APP_FOLDER }}"; fi)"

    - name: Setup Keychain and Import Certificate
      env:
        CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        CERT_PASSWORD: ${{ secrets.P12_PASSWORD }}
        TEMP_KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }} # Password for the temporary keychain itself
      run: |
        security create-keychain -p "${TEMP_KEYCHAIN_PASSWORD}" "${{ env.KEYCHAIN_NAME }}"
        security list-keychains -s "${{ env.KEYCHAIN_NAME }}"
        security default-keychain -s "${{ env.KEYCHAIN_NAME }}"
        security unlock-keychain -p "${TEMP_KEYCHAIN_PASSWORD}" "${{ env.KEYCHAIN_NAME }}"
        security set-keychain-settings -lut 21600 "${{ env.KEYCHAIN_NAME }}"

        echo "${CERTIFICATE_BASE64}" | base64 --decode > certificate.p12
        security import certificate.p12 -k "${{ env.KEYCHAIN_NAME }}" -P "${CERT_PASSWORD}" -A -T /usr/bin/codesign
        rm certificate.p12
        echo "Certificate imported."

    - name: Install Provisioning Profile
      env:
        PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
      run: |
        PROFILE_PATH_TEMP="profile.mobileprovision"
        echo "${PROFILE_BASE64}" | base64 --decode > "${PROFILE_PATH_TEMP}"
        
        # Check if profile is empty or invalid
        if [ ! -s "${PROFILE_PATH_TEMP}" ]; then
          echo "Error: Decoded provisioning profile is empty."
          exit 1
        fi
        
        # Attempt to extract UUID
        PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< $(security cms -D -i "${PROFILE_PATH_TEMP}") 2>/dev/null || echo "ERROR_EXTRACTING_UUID")

        if [ "$PROFILE_UUID" == "ERROR_EXTRACTING_UUID" ] || [ -z "$PROFILE_UUID" ]; then
            echo "Error: Could not extract UUID from provisioning profile. Please ensure it's a valid .mobileprovision file."
            security cms -D -i "${PROFILE_PATH_TEMP}" # Print decoded content for debugging
            exit 1
        fi
        
        TARGET_PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
        mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
        mv "${PROFILE_PATH_TEMP}" "${TARGET_PROFILE_PATH}"
        echo "Installed provisioning profile with UUID: ${PROFILE_UUID} to ${TARGET_PROFILE_PATH}"

    - name: Build KMP Shared Framework (Gradle)
      run: |
        cd "${{ steps.paths.outputs.ROOT_DIR }}"
        chmod +x gradlew
        # Common tasks: :embedAndSignAppleFrameworkForXcode, :packForXCode
        # Or your project's specific tasks like :generateDummyFramework and :podspec
        echo "Running Gradle KMP build in $(pwd) with task: ${{ steps.paths.outputs.GRADLE_KMP_MODULE_PATH }}:generateDummyFramework"
        ./gradlew ${{ steps.paths.outputs.GRADLE_KMP_MODULE_PATH }}:generateDummyFramework

        echo "Running Gradle KMP build in $(pwd) with task: ${{ steps.paths.outputs.GRADLE_KMP_MODULE_PATH }}:podspec"
        ./gradlew ${{ steps.paths.outputs.GRADLE_KMP_MODULE_PATH }}:podspec

    - name: Install CocoaPods (if used)
      if: hashFiles(format('{0}/Podfile', steps.paths.outputs.IOS_DIR)) != ''
      run: |
        echo "Installing CocoaPods in ${{ steps.paths.outputs.IOS_DIR }}"
        cd "${{ steps.paths.outputs.IOS_DIR }}"
        gem install cocoapods
        pod install --repo-update
        echo "CocoaPods installation complete."

    - name: Archive iOS App (Xcode)
      env:
        # You might still need TEAM_ID if not fully covered by ExportOptions or for other build settings
        # If your ExportOptions.plist handles teamID fully, you might not need to pass it here.
        # However, Xcode sometimes prefers it explicitly for the archive step.
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }} # Add this secret if you have/need it
        IOS_WORKSPACE_PATH: "${{ steps.paths.outputs.IOS_DIR }}/${{ env.IOS_SCHEME }}.xcworkspace"
        IOS_PROJECT_PATH: "${{ steps.paths.outputs.IOS_DIR }}/${{ env.IOS_SCHEME }}.xcodeproj"
      run: |
        echo "Archiving from iOS Directory: ${{ steps.paths.outputs.IOS_DIR }}"
        XCODE_BUILD_CMD="xcodebuild archive -sdk iphoneos -configuration Release -archivePath $RUNNER_TEMP/${{ env.IOS_SCHEME }}.xcarchive"
        XCODE_BUILD_CMD="$XCODE_BUILD_CMD -scheme \"${{ env.IOS_SCHEME }}\""
        
        if [ -d "$IOS_WORKSPACE_PATH" ]; then
          echo "Using workspace: $IOS_WORKSPACE_PATH"
          XCODE_BUILD_CMD="$XCODE_BUILD_CMD -workspace \"$IOS_WORKSPACE_PATH\""
        else
          echo "Using project: $IOS_PROJECT_PATH"
          XCODE_BUILD_CMD="$XCODE_BUILD_CMD -project \"$IOS_PROJECT_PATH\""
        fi
        
        # If APPLE_TEAM_ID secret exists and is not empty, use it. Otherwise, rely on ExportOptions.plist.
        TEAM_ID_TO_USE=""
        if [ -n "${{ secrets.APPLE_TEAM_ID }}" ]; then
            TEAM_ID_TO_USE="${{ secrets.APPLE_TEAM_ID }}"
            XCODE_BUILD_CMD="$XCODE_BUILD_CMD DEVELOPMENT_TEAM=\"$TEAM_ID_TO_USE\""
        fi
        
        XCODE_BUILD_CMD="$XCODE_BUILD_CMD CODE_SIGN_STYLE=\"Manual\" CODE_SIGN_IDENTITY=\"Apple Distribution\""
        
        echo "Running Xcode archive command: $XCODE_BUILD_CMD"
        eval $XCODE_BUILD_CMD
        echo "Archiving complete. Archive at $RUNNER_TEMP/${{ env.IOS_SCHEME }}.xcarchive"


    - name: Export IPA
      env:
        EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.EXPORT_OPTIONS_PLIST }}
      run: |
        EXPORT_OPTS_PATH="$RUNNER_TEMP/ExportOptions.plist"
        echo "${EXPORT_OPTIONS_PLIST_BASE64}" | base64 --decode > "${EXPORT_OPTS_PATH}"
        
        echo "Content of decoded ExportOptions.plist:"
        cat "${EXPORT_OPTS_PATH}" # For debugging

        echo "Exporting IPA from archive: $RUNNER_TEMP/${{ env.IOS_SCHEME }}.xcarchive"
        xcodebuild -exportArchive \
          -archivePath "$RUNNER_TEMP/${{ env.IOS_SCHEME }}.xcarchive" \
          -exportPath "$RUNNER_TEMP/build" \
          -exportOptionsPlist "${EXPORT_OPTS_PATH}" \
          ALLOW_UNSIGNED_CODE_SIGNING=NO
        echo "IPA export complete. IPA should be in $RUNNER_TEMP/build"

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-app-${{ env.IOS_SCHEME }}
        path: ${{ runner.temp }}/build/*.ipa # Use runner.temp for paths created in RUNNER_TEMP
        if-no-files-found: error

    - name: Clean up keychain
      if: always()
      env:
          TEMP_KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |
        security delete-keychain "${{ env.KEYCHAIN_NAME }}" || echo "Keychain already deleted or not found."
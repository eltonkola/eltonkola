
name: Prepare Project

on:
  workflow_call:

jobs:
  prepare-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Run lints
        run: |
          cd EltonKola_Web
          chmod +x gradlew  
          ./gradlew :composeApp:lint
name: Build Resume PDF
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger

jobs:
  build-resume:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Install pandoc and texlive-xetex
      run: |
        sudo apt-get update
        sudo apt-get install -y pandoc texlive-xetex fonts-noto fonts-noto-color-emoji fonts-symbola
    - name: Convert markdown to PDF
      run: |
        # Get current date for filename
        DATE=$(date +"%Y")
        OUTPUT_FILE="Resume_EltonKola_${DATE}.pdf"
        pandoc resume.md -o "$OUTPUT_FILE" \
              --pdf-engine=xelatex \
              -V mainfont="Noto Sans" \
              -V fontfamily="Noto Sans,Noto Sans Symbols2,Symbola" \
              -V geometry=margin=0.75in \
              -V urlcolor=blue \
              -V linkcolor=blue \
              --from markdown+smart \
              -V title=""

        echo "PDF_FILENAME=$OUTPUT_FILE" >> $GITHUB_ENV
        
    - name: Upload PDF artifact
      uses: actions/upload-artifact@v4
      with:
        name: elton-kola-resume-${{ env.PDF_FILENAME }}
        path: ${{ env.PDF_FILENAME }}
        retention-days: 30
        
    - name: Create Release (optional - only on tags)
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Resume ${{ github.ref }}
        draft: false
        prerelease: false
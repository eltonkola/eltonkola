name: Build Resume PDF

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-resume:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pandoc fonts-noto-color-emoji fonts-noto
        wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        sudo apt install -y ./google-chrome-stable_current_amd64.deb

    - name: Generate HTML from Markdown (no title, custom CSS)
      run: |
        pandoc resume.md -o resume.html \
          --from markdown+smart \
          --css resume.css \
          --metadata title="" \
          --standalone

    - name: Convert HTML to PDF using Headless Chrome
      run: |
        DATE=$(date +"%Y")
        OUTPUT_FILE="Resume_EltonKola_${DATE}.pdf"

        google-chrome --headless --disable-gpu --no-sandbox \
          --print-to-pdf-no-header \
          --virtual-time-budget=10000 \
          --print-to-pdf="$OUTPUT_FILE" \
          resume.html

        echo "PDF_FILENAME=$OUTPUT_FILE" >> $GITHUB_ENV


    - name: Upload PDF artifact
      uses: actions/upload-artifact@v4
      with:
        name: elton-kola-resume
        path: ${{ env.PDF_FILENAME }}
        retention-days: 30
